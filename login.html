<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Character Encoding & Viewport -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA Manifest & App Theming -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#060913">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIFFIN">

<!-- Standard Browser & Android Icons -->
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">

<!-- iOS Safari Home Screen Icons -->
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
  <title>Log in — TIFFIN</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrap { padding: 56px 0 80px; }
    .auth-grid { display: flex; justify-content: center; align-items: center; width: 100%; max-width: 440px; margin: 0 auto; }
    .auth-panel { width: 100%; padding: 32px; }
    .auth-tabs { display: flex; gap: 6px; background: rgba(6, 9, 19, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 5px; margin-bottom: 26px; }
    .auth-tab { flex: 1; border: none; background: transparent; padding: 11px; border-radius: 8px; font-weight: 700; font-size: 14px; color: var(--ink-soft); cursor: pointer; transition: all 0.2s ease; }
    .auth-tab.active { background: rgba(56, 189, 248, 0.2); color: #FFFFFF; border: 1px solid rgba(56, 189, 248, 0.4); box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); }
    .small-note { font-size: 12px; margin-top: 12px; text-align: center; color: var(--ink-soft); }
  </style>
</head>
<body>
<div id="nav-root"></div>

<main class="wrap auth-wrap">
  <div class="auth-grid">
    <div class="auth-panel panel">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="signin" id="tabLogin" type="button">Log in</button>
        <button class="auth-tab" data-tab="signup" id="tabRegister" type="button">Create account</button>
      </div>

      <!-- Sign In Form -->
      <form id="signinForm" class="auth-form">
        <div class="field">
          <label for="si-email">Email</label>
          <input type="email" id="si-email" placeholder="you@campus.edu" required>
        </div>
        <div class="field">
          <label for="si-pass">Password</label>
          <input type="password" id="si-pass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-turmeric">Log in →</button>
        <p class="muted small-note">Demo account — <strong>aarav@campus.edu</strong> / <strong>demo1234</strong></p>

        <div class="auth-divider">
          <span>or continue with</span>
        </div>
        <button type="button" class="btn-google googleAuthBtn">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Sign in with Google</span>
        </button>
      </form>

      <!-- Sign Up Form -->
      <form id="signupForm" class="auth-form" style="display:none;">
        <div class="field">
          <label for="su-name">Full name</label>
          <input type="text" id="su-name" placeholder="Aarav Shah" required>
        </div>
        <div class="field">
          <label for="su-email">Email</label>
          <input type="email" id="su-email" placeholder="you@campus.edu" required>
        </div>
        <div class="field">
          <label for="su-pass">Password</label>
          <input type="password" id="su-pass" placeholder="At least 6 characters" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-turmeric">Create account →</button>

        <div class="auth-divider">
          <span>or continue with</span>
        </div>
        <button type="button" class="btn-google googleAuthBtn">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Sign up with Google</span>
        </button>
      </form>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <span>TIFFIN — Campus Canteen Pre-Order</span>
    <span>Built for the lunch rush.</span>
  </div>
</footer>

<div id="toast"></div>

<!-- 1. Firebase Compatibility SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- 2. Application Logic -->
<script src="app.js"></script>

<script>
  renderNav('login');

  // Tab Switching
  const tabButtons = document.querySelectorAll('.auth-tab');
  const signinForm = document.getElementById('signinForm');
  const signupForm = document.getElementById('signupForm');

  tabButtons.forEach((tab, index) => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      tabButtons.forEach(b => b.classList.remove('active'));
      tab.classList.add('active');

      const target = tab.dataset.tab || (index === 0 ? 'signin' : 'signup');

      if (target === 'signin') {
        if (signinForm) signinForm.style.display = 'flex';
        if (signupForm) signupForm.style.display = 'none';
      } else {
        if (signinForm) signinForm.style.display = 'none';
        if (signupForm) signupForm.style.display = 'flex';
      }
    });
  });

  // 1. Email Sign Up Handler
  if (signupForm) {
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('su-name').value.trim();
      const email = document.getElementById('su-email').value.trim();
      const password = document.getElementById('su-pass').value;

      try {
        const user = await registerUser(name, email, password);
        if (user) {
          setTimeout(() => {
            window.location.href = 'menu.html';
          }, 400);
        }
      } catch (err) {
        console.error(err);
      }
    });
  }

  // 2. Email Login Handler
  if (signinForm) {
    signinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('si-email').value.trim();
      const password = document.getElementById('si-pass').value;

      try {
        const user = await loginUser(email, password);
        if (user) {
          setTimeout(() => {
            window.location.href = 'menu.html';
          }, 400);
        }
      } catch (err) {
        console.error(err);
      }
    });
  }

  // 3. Google Sign In Handler
  document.querySelectorAll('.googleAuthBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        const user = await loginWithGoogle();
        if (user) {
          setTimeout(() => {
            window.location.href = 'menu.html';
          }, 400);
        }
      } catch (err) {
        console.error(err);
      }
    });
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    let refreshing = false;

    // Detect when the new service worker takes over and refresh the app
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then((reg) => {
        // Check for updates on every app launch
        reg.update();
      });
    });
  }
</script>
</body>
</html>
