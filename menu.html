<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#060913">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIFFIN">

<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Today's Menu — TIFFIN</title>
<link rel="stylesheet" href="style.css?v=6">
<style>
  html, body {
    width: 100% !important;
    max-width: 100vw !important;
    overflow-x: hidden !important;
    background-color: #060913 !important;
    background-image: none !important;
    margin: 0 !important;
    padding: 0 !important;
    box-sizing: border-box !important;
  }

  *, *::before, *::after {
    box-sizing: border-box !important;
  }

  .wrap {
    width: 100% !important;
    max-width: 1180px !important;
    margin: 0 auto !important;
    padding: 0 16px !important;
  }

  /* Header and Dropdown Stacking Context */
  .menu-hero {
    position: relative !important;
    z-index: 1000 !important;
    padding: 16px 0 8px !important;
    background: transparent !important;
    background-image: none !important;
    width: 100% !important;
  }

  .menu-hero-title {
    font-family: var(--display);
    font-size: clamp(22px, 4vw, 34px);
    margin: 4px 0 14px !important;
  }

  .search-row {
    display: flex !important;
    gap: 10px !important;
    width: 100% !important;
    position: relative !important;
    z-index: 1001 !important;
  }

  .search-row input {
    flex: 1 1 auto !important;
    min-width: 0 !important;
    width: 100% !important;
    padding: 12px 14px !important;
    border-radius: 12px !important;
    font-size: 14px !important;
  }

  .glass-select-wrapper {
    flex: 0 0 auto !important;
    position: relative !important;
    z-index: 1002 !important;
  }

  .glass-dropdown-menu {
    position: absolute !important;
    top: calc(100% + 6px) !important;
    left: 0 !important;
    right: 0 !important;
    z-index: 999999 !important;
    background: #0b1120 !important;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(56, 189, 248, 0.3) !important;
  }

  .filter-row {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 8px !important;
    margin-top: 10px !important;
    width: 100% !important;
  }

  .chip {
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: var(--ink-soft);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .chip.active {
    background: rgba(56, 189, 248, 0.18);
    border-color: var(--ice-cyan);
    color: #fff;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
  }

  .menu-main {
    position: relative !important;
    z-index: 1 !important;
    padding: 10px 0 90px !important; /* Extra bottom padding so floating button doesn't hide cards */
    margin-top: 0 !important;
    width: 100% !important;
  }

  .menu-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)) !important;
    gap: 12px !important;
    width: 100% !important;
  }

  .food-card {
    padding: 10px !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important;
    border-radius: 14px !important;
    min-width: 0 !important;
  }

  .food-img-wrap {
    position: relative;
    width: 100%;
    height: 120px;
    border-radius: 10px;
    overflow: hidden;
    background: rgba(15,23,42,0.6);
  }

  .food-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    font-size: 9.5px !important;
    padding: 3px 6px !important;
  }

  .food-content {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 6px 0 4px;
    min-width: 0;
  }

  .food-name {
    font-family: var(--display);
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 4px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .food-desc {
    font-size: 11px;
    color: var(--ink-soft);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .food-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  .food-price {
    font-family: var(--mono);
    font-weight: 800;
    font-size: 14.5px;
    color: #fff;
  }

  .qty-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .qty-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
  }

  .qty-val {
    font-family: var(--mono);
    font-weight: 700;
    min-width: 14px;
    text-align: center;
    font-size: 13px;
  }

  /* ============================================================
     Floating Bottom Cart Bar / Button
     ============================================================ */
  .floating-cart-btn {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    opacity: 0;
    pointer-events: none;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    background: linear-gradient(135deg, #F59E0B, #D97706);
    color: #060913;
    padding: 12px 24px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 800;
    font-size: 14px;
    box-shadow: 0 10px 30px rgba(245, 158, 11, 0.55), 0 4px 12px rgba(0, 0, 0, 0.5);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
    min-width: 260px;
  }

  .floating-cart-btn.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  .floating-cart-btn:hover {
    transform: translateX(-50%) translateY(-3px) scale(1.03);
    box-shadow: 0 14px 35px rgba(245, 158, 11, 0.7);
  }

  .floating-cart-badge {
    background: #060913;
    color: #F59E0B;
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 12px;
    font-family: var(--mono);
    font-weight: 800;
  }

  @media (max-width: 600px) {
    .wrap {
      padding: 0 10px !important;
    }

    .search-row {
      flex-direction: column !important;
      gap: 8px !important;
    }

    .glass-select-wrapper,
    .glass-select-trigger {
      width: 100% !important;
    }

    .menu-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 8px !important;
    }

    .food-img-wrap {
      height: 95px !important;
    }

    .floating-cart-btn {
      bottom: 16px;
      min-width: calc(100% - 32px);
      max-width: 360px;
      padding: 12px 20px;
    }
  }
</style>
</head>
<body>
<div id="nav-root"></div>
<header class="dark-shell menu-hero">
  <div class="wrap">
    <p class="eyebrow">Today on the counter</p>
    <h1 class="menu-hero-title">What are we eating?</h1>
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="Search for dosa, chai, sandwich…" autocomplete="off">
      
      <div class="glass-select-wrapper" id="customCategoryWrapper">
        <button type="button" class="glass-select-trigger" id="categoryTrigger">
          <span id="selectedCategoryLabel">All categories</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="glass-dropdown-menu" id="customCategoryMenu"></div>
      </div>
    </div>
    <div class="filter-row">
      <button class="chip active" data-veg="all">All</button>
      <button class="chip" data-veg="veg">🟢 Veg only</button>
      <button class="chip" data-veg="nonveg">🔴 Non-veg</button>
    </div>
  </div>
</header>

<main class="wrap menu-main">
  <div id="menuGrid" class="menu-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="big">Nothing matches that search</div>
    <p>Try a different dish or clear your filters.</p>
  </div>
</main>

<!-- Floating Floating View Cart Button -->
<a href="cart.html" id="floatingCartBtn" class="floating-cart-btn">
  <div style="display: flex; align-items: center; gap: 8px;">
    <span id="floatingCartCount" class="floating-cart-badge">0 items</span>
    <span id="floatingCartTotal" style="font-family: var(--mono); font-weight: 800;">₹0</span>
  </div>
  <div style="display: flex; align-items: center; gap: 4px;">
    <span>View Cart</span>
    <span>→</span>
  </div>
</a>

<footer class="foot">
  <div class="wrap">
    <span>TIFFIN — Campus Canteen Pre-Order</span>
    <span>Menu refreshes daily by the kitchen team.</span>
  </div>
</footer>

<div id="toast"></div>
<script src="app.js?v=6"></script>
<script>
  renderNav('menu');
  
  const student = currentStudent();
  const currentUid = student ? student.id : 'guest';

  const menu = getMenu();
  let filters = { q: '', category: 'all', veg: 'all' };

  const cats = ['all', ...Array.from(new Set(menu.map(m => m.category)))];
  const trigger = document.getElementById('categoryTrigger');
  const menuList = document.getElementById('customCategoryMenu');
  const wrapper = document.getElementById('customCategoryWrapper');
  const label = document.getElementById('selectedCategoryLabel');

  menuList.innerHTML = cats.map(c => `
    <div class="glass-option ${c === filters.category ? 'selected' : ''}" data-cat="${c}">
      ${c === 'all' ? 'All categories' : c}
    </div>
  `).join('');

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    wrapper.classList.toggle('open');
  });

  menuList.querySelectorAll('.glass-option').forEach(opt => {
    opt.addEventListener('click', () => {
      filters.category = opt.dataset.cat;
      label.textContent = opt.dataset.cat === 'all' ? 'All categories' : opt.dataset.cat;
      menuList.querySelectorAll('.glass-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      wrapper.classList.remove('open');
      draw();
    });
  });

  document.addEventListener('click', () => wrapper.classList.remove('open'));

  document.getElementById('searchInput').addEventListener('input', e => { 
    filters.q = e.target.value.toLowerCase().trim(); 
    draw(); 
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      filters.veg = chip.dataset.veg;
      draw();
    });
  });

  function matches(item){
    if(filters.category !== 'all' && item.category !== filters.category) return false;
    if(filters.veg === 'veg' && !item.veg) return false;
    if(filters.veg === 'nonveg' && item.veg) return false;
    if(filters.q && !item.name.toLowerCase().includes(filters.q) && !item.desc.toLowerCase().includes(filters.q)) return false;
    return true;
  }

  function qtyInCart(itemId){
    const cart = getCart(currentUid);
    const line = cart.find(l => l.id === itemId);
    return line ? line.qty : 0;
  }

  function updateFloatingCart(){
    const cart = getCart(currentUid);
    const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
    const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    
    const floatingBtn = document.getElementById('floatingCartBtn');
    const countBadge = document.getElementById('floatingCartCount');
    const totalSpan = document.getElementById('floatingCartTotal');

    if(totalItems > 0){
      countBadge.textContent = `${totalItems} ${totalItems === 1 ? 'item' : 'items'}`;
      totalSpan.textContent = money(totalPrice);
      floatingBtn.classList.add('show');
    } else {
      floatingBtn.classList.remove('show');
    }
  }

  function changeQty(itemId, delta){
    const item = menu.find(m => m.id === itemId);
    if(!item || !item.available) return;
    let cart = getCart(currentUid);
    let line = cart.find(l => l.id === itemId);
    if(!line && delta > 0){
      cart.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
    } else if(line){
      line.qty += delta;
      if(line.qty <= 0) cart = cart.filter(l => l.id !== itemId);
    }
    saveCart(currentUid, cart);
    renderNav('menu');
    draw();
    updateFloatingCart();
    if(delta > 0) toast(`Added ${item.name} to cart`);
  }

  function draw(){
    const list = menu.filter(matches);
    const grid = document.getElementById('menuGrid');
    document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
    
    grid.innerHTML = list.map(item => {
      const q = qtyInCart(item.id);
      const fallbackImg = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=80';
      
      return `
      <div class="panel food-card ${item.available ? '' : 'unavailable'}">
        <div class="food-img-wrap">
          <img class="food-img" src="${item.img || fallbackImg}" alt="${item.name}" loading="lazy">
          <span class="tag ${item.veg ? 'tag-veg' : 'tag-nonveg'} card-badge">${item.veg ? '● Veg' : '● Non-veg'}</span>
          ${!item.available ? `<span class="tag tag-out unavailable-ribbon">Sold out</span>` : ''}
        </div>
        <div class="food-content">
          <div class="food-name">${item.name}</div>
          <div class="food-desc">${item.desc}</div>
        </div>
        <div class="food-bottom">
          <span class="food-price">${money(item.price)}</span>
          ${item.available ? (
            q > 0
            ? `<div class="qty-row">
                 <button class="qty-btn" data-action="dec" data-id="${item.id}">–</button>
                 <span class="qty-val">${q}</span>
                 <button class="qty-btn" data-action="inc" data-id="${item.id}">+</button>
               </div>`
            : `<button class="btn btn-sm btn-turmeric" data-action="inc" data-id="${item.id}">Add +</button>`
          ) : `<span class="muted" style="font-size:12px;">Unavailable</span>`}
        </div>
      </div>`;
    }).join('');

    grid.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => changeQty(btn.dataset.id, btn.dataset.action === 'inc' ? 1 : -1));
    });

    updateFloatingCart();
  }

  draw();
</script>
</body>
</html>
