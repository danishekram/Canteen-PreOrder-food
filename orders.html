<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order History — TIFFIN</title>
<link rel="stylesheet" href="style.css?v=5">
<style>
  html, body {
    height: 100% !important;
    min-height: 100vh !important;
    display: flex !important;
    flex-direction: column !important;
    margin: 0 !important;
  }

  .oh-wrap {
    flex: 1 0 auto !important;
    display: flex !important;
    flex-direction: column !important;
    padding: 24px 16px 60px !important;
    width: 100% !important;
    max-width: 1180px !important;
    margin: 0 auto !important;
    box-sizing: border-box !important;
  }

  .page-title {
    font-family: var(--display);
    font-size: clamp(24px, 4vw, 36px);
    margin: 6px 0 24px;
  }

  .order-card {
    padding: 20px 22px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .order-token {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 20px;
    color: var(--chili);
    min-width: 74px;
  }

  .order-meta {
    flex: 1;
    min-width: 180px;
  }

  .order-items-line {
    font-size: 14px;
    font-weight: 600;
  }

  .order-sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 3px;
  }

  .order-total {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
  }

  .foot {
    flex-shrink: 0 !important;
    margin-top: auto !important;
    width: 100% !important;
    background: rgba(6, 9, 19, 0.95) !important;
    border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
    padding: 16px 0 !important;
  }

  .foot .wrap {
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    flex-wrap: wrap !important;
    gap: 8px 16px !important;
    padding: 0 16px !important;
    font-size: 12px !important;
    color: #94A3B8 !important;
  }
</style>
</head>
<body>
<div id="nav-root"></div>

<main class="wrap oh-wrap">
  <p class="eyebrow">Your history</p>
  <h1 class="page-title">Previous orders</h1>
  <div id="ordersList"></div>
</main>

<footer class="foot">
  <div class="wrap">
    <span>TIFFIN — Campus Canteen Pre-Order</span>
    <span>Loved something? Reorder it in one tap.</span>
  </div>
</footer>

<div id="toast"></div>
<script src="app.js"></script>
<script>
  renderNav('orders');
  const student = requireStudentAuth();

  function draw(){
    const orders = getOrders().filter(o=>o.uid===student.id).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
    const list = document.getElementById('ordersList');

    if(orders.length === 0){
      list.innerHTML = `
        <div class="panel empty-state">
          <div class="big">No orders yet</div>
          <p>Your placed orders will show up here.</p>
          <a href="menu.html" class="btn btn-turmeric" style="margin-top:16px;">Browse menu →</a>
        </div>`;
      return;
    }

    list.innerHTML = orders.map(o => `
      <div class="panel order-card">
        <div class="order-token">#${o.token}</div>
        <div class="order-meta">
          <div class="order-items-line">${o.items.map(i=>`${i.name} ×${i.qty}`).join(', ')}</div>
          <div class="order-sub">Placed ${fmtTime(o.createdAt)} · Pickup ${new Date(o.pickupTime).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <span class="tag ${o.status==='completed' ? 'tag-out' : 'tag-status'}" style="text-transform:capitalize;">${STATUS_LABEL[o.status]}</span>
        <div class="order-total">${money(o.total)}</div>
        <button class="btn btn-sm btn-outline" data-reorder="${o.id}">Reorder</button>
        ${o.status !== 'completed' ? `<a href="track.html?order=${o.id}" class="btn btn-sm btn-turmeric">Track</a>` : ''}
      </div>`).join('');

    list.querySelectorAll('[data-reorder]').forEach(btn => {
      btn.addEventListener('click', () => {
        const order = orders.find(o=>o.id===btn.dataset.reorder);
        const menu = getMenu();
        let cart = getCart(student.id);
        order.items.forEach(line => {
          const item = menu.find(m=>m.id===line.id);
          if(!item || !item.available) return;
          const existing = cart.find(l=>l.id===line.id);
          if(existing) existing.qty += line.qty;
          else cart.push({ id:line.id, name:line.name, price:item.price, qty:line.qty });
        });
        saveCart(student.id, cart);
        renderNav('orders');
        toast('Added to cart from your previous order.');
      });
    });
  }

  draw();
</script>
</body>
</html>
