<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order — TIFFIN</title>
<link rel="stylesheet" href="style.css?v=17">
<style>
  html, body {
    height: 100% !important;
    min-height: 100vh !important;
    display: flex !important;
    flex-direction: column !important;
    margin: 0 !important;
  }

  .track-wrap {
    flex: 1 0 auto !important;
    display: flex !important;
    flex-direction: column !important;
    padding: 24px 16px 60px !important;
    width: 100% !important;
    max-width: 1180px !important;
    margin: 0 auto !important;
    box-sizing: border-box !important;
  }

  .page-title {
    font-family: var(--display);
    font-size: clamp(24px, 4vw, 36px);
    margin: 6px 0 24px;
  }

  .track-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
    align-items: start;
    width: 100%;
  }

  @media (max-width: 880px) {
    .track-layout { grid-template-columns: 1fr; }
  }

  .timeline { padding: 24px; }
  .tl-item { display: flex; gap: 16px; padding-bottom: 24px; position: relative; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: 0; width: 2px; background: rgba(255, 255, 255, 0.1); }
  .tl-item:last-child::before { display: none; }
  .tl-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); background: rgba(15, 23, 42, 0.8); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .tl-item.done .tl-dot { background: var(--mint); border-color: var(--mint); color: #000; }
  .tl-item.current .tl-dot { background: var(--honey); border-color: var(--honey); }
  .tl-title { font-weight: 700; font-size: 15px; }
  .tl-item.done .tl-title, .tl-item.current .tl-title { color: #fff; }
  .tl-item:not(.done):not(.current) .tl-title { color: var(--ink-soft); }
  .tl-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .track-ticket { padding: 24px; }
  .track-order-items { margin-top: 14px; }
  .order-item-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; }

  .picker { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .order-pick { border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(15, 23, 42, 0.6); padding: 8px 14px; border-radius: 999px; font-family: var(--mono); font-size: 12px; font-weight: 700; color: #fff; cursor: pointer; }
  .order-pick.active { background: var(--ice-cyan); border-color: var(--ice-cyan); color: #000; }

  .cancel-banner {
    padding: 16px;
    border-radius: 12px;
    background: rgba(251, 113, 133, 0.15);
    border: 1px solid rgba(251, 113, 133, 0.3);
    color: var(--chili);
    margin-bottom: 16px;
    font-size: 13.5px;
    font-weight: 600;
  }

  .foot {
    flex-shrink: 0 !important;
    margin-top: auto !important;
    width: 100% !important;
    background: rgba(6, 9, 19, 0.95) !important;
    border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
    padding: 16px 0 !important;
  }

  .foot .wrap {
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    flex-wrap: wrap !important;
    gap: 8px 16px !important;
    padding: 0 16px !important;
    font-size: 12px !important;
    color: #94A3B8 !important;
  }
</style>
</head>
<body>
<div id="nav-root"></div>

<main class="wrap track-wrap">
  <p class="eyebrow">Live status</p>
  <h1 class="page-title">Track your order</h1>
  <div id="trackContent"></div>
</main>

<footer class="foot">
  <div class="wrap">
    <span>TIFFIN — Campus Canteen Pre-Order</span>
    <span>Status updates as the kitchen moves your order along.</span>
  </div>
</footer>

<div id="toast"></div>
<script src="app.js"></script>
<script>
  renderNav('track');
  const student = requireStudentAuth();

  const params = new URLSearchParams(window.location.search);
  let selectedOrderId = params.get('order');

  function activeOrders(){
    return getOrders()
      .filter(o => o.uid === student.id && o.status !== 'completed')
      .sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  }

  function cancelStudentOrder(orderId){
    if(!confirm('Are you sure you want to cancel this order?')) return;
    
    let orders = getOrders();
    const order = orders.find(o => o.id === orderId);
    if(order && (order.status === 'pending' || order.status === 'accepted')){
      order.status = 'cancelled';
      saveOrders(orders);
      toast(`Token #${order.token} cancelled.`);
      draw();
    } else {
      toast('Cannot cancel: Kitchen has already started preparing food.');
    }
  }

  function draw(){
    const orders = activeOrders();
    const content = document.getElementById('trackContent');

    if(orders.length === 0){
      content.innerHTML = `
        <div class="panel empty-state">
          <div class="big">No active orders</div>
          <p>Place an order and it'll show up here with live status.</p>
          <a href="menu.html" class="btn btn-turmeric" style="margin-top:16px;">Browse menu →</a>
        </div>`;
      return;
    }

    if(!selectedOrderId || !orders.find(o=>o.id===selectedOrderId)){
      selectedOrderId = orders[0].id;
    }
    const order = orders.find(o=>o.id===selectedOrderId);

    const picker = orders.length > 1 ? `
      <div class="picker">
        ${orders.map(o => `<button class="order-pick ${o.id===selectedOrderId?'active':''}" data-id="${o.id}">Token #${o.token}</button>`).join('')}
      </div>` : '';

    const isTerminated = order.status === 'cancelled' || order.status === 'rejected';
    const canCancel = order.status === 'pending' || order.status === 'accepted';

    const stepIdx = STATUS_FLOW.indexOf(order.status);
    const steps = [
      { key:'pending', title:'Order placed', sub:`Placed at ${fmtTime(order.createdAt)}` },
      { key:'accepted', title:'Accepted by canteen', sub:'Kitchen has your order' },
      { key:'preparing', title:'Being prepared', sub:'Your food is on the stove' },
      { key:'ready', title:'Ready for pickup', sub:`Collect at the counter — Token #${order.token}` },
      { key:'completed', title:'Picked up', sub:'Enjoy your meal!' }
    ];

    content.innerHTML = `
      ${picker}
      ${order.status === 'cancelled' ? `<div class="cancel-banner">✕ This order was cancelled by you.</div>` : ''}
      ${order.status === 'rejected' ? `<div class="cancel-banner">✕ This order was declined by the kitchen (Items may be unavailable).</div>` : ''}
      
      <div class="track-layout">
        <div class="panel timeline">
          ${isTerminated ? `
            <div style="color:var(--ink-soft); font-size:14px; text-align:center; padding:20px 0;">
              Order is no longer active.
            </div>` : 
            steps.map((s,i) => `
              <div class="tl-item ${i < stepIdx ? 'done' : i === stepIdx ? 'current' : ''}">
                <div class="tl-dot">${i < stepIdx ? '✓' : ''}</div>
                <div>
                  <div class="tl-title">${s.title}</div>
                  <div class="tl-sub">${s.sub}</div>
                </div>
              </div>`).join('')}
        </div>
        <div class="ticket track-ticket">
          <div class="ticket-label">Your token</div>
          <div class="ticket-token">#${order.token}</div>
          <div class="ticket-row"><span>Status</span><span class="status-${order.status}" style="font-weight:700; text-transform:capitalize;">${STATUS_LABEL[order.status]}</span></div>
          <div class="ticket-row"><span>Pickup slot</span><span>${new Date(order.pickupTime).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}</span></div>
          <div class="ticket-row"><span>Total</span><span>${money(order.total)}</span></div>
          <div class="track-order-items">
            ${order.items.map(l => `<div class="order-item-row"><span>${l.name} ×${l.qty}</span><span>${money(l.price*l.qty)}</span></div>`).join('')}
          </div>
          
          ${canCancel ? `
            <button type="button" class="btn btn-outline" style="width:100%; margin-top:16px; color:var(--chili); border-color:var(--chili);" onclick="cancelStudentOrder('${order.id}')">
              Cancel Order
            </button>` : ''}
        </div>
      </div>`;

    content.querySelectorAll('.order-pick').forEach(btn => {
      btn.addEventListener('click', () => { selectedOrderId = btn.dataset.id; draw(); });
    });
  }

  draw();
  setInterval(draw, 4000);
</script>
</body>
</html>
